<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반짝반짝 틀린 그림 찾기</title>
<style>
:root{
  --bg:linear-gradient(135deg,#ffe8f3 0%,#fff7db 50%,#e4f5ff 100%);
  --card:rgba(255,255,255,.94);
  --text:#4a4458; --sub:#7a728a;
  --s:1; /* 그림 영역 배율 (JS가 조절) */
}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  padding:10px;height:100dvh;background:var(--bg);
  font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--text);
  display:flex;flex-direction:row;align-items:stretch;gap:10px;
}
body.fullscreen-mode{padding:6px;gap:6px}

/* 좌우 세로 바 (가로 화면 기본) */
.top-bar,.bottom-timer-bar{
  background:var(--card);backdrop-filter:blur(8px);
  border:3px solid #fff;box-shadow:0 10px 25px rgba(255,145,190,.16);flex:none;
}
.top-bar{
  width:104px;padding:14px 8px;border-radius:28px;
  display:flex;flex-direction:column;justify-content:space-between;align-items:center;gap:10px;
}
.stage-badge{
  background:linear-gradient(135deg,#ff85b3,#ff5c93);color:#fff;
  font-size:.95rem;font-weight:900;padding:8px 10px;border-radius:18px;
  box-shadow:0 4px 10px rgba(255,92,147,.3);text-align:center;width:100%;line-height:1.25;
}
.stars-container{
  display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;
  background:#fff9eb;padding:10px 8px;border-radius:24px;border:2px solid #ffe8a3;width:100%;
  flex:1;min-height:0;overflow:hidden;
}
.star{width:34px;height:34px;fill:#e8ecf2;stroke:#d8dee9;stroke-width:1.5;transition:fill .3s,stroke .3s;flex:none}
.star.earned{fill:#ffd13b;stroke:#f59e0b;animation:starPop .7s cubic-bezier(.34,1.56,.64,1) forwards;filter:drop-shadow(0 0 12px rgba(255,209,59,.9))}
@keyframes starPop{0%{transform:scale(.3) rotate(-40deg)}50%{transform:scale(1.45) rotate(18deg)}75%{transform:scale(.9) rotate(-6deg)}100%{transform:scale(1) rotate(0)}}

.action-buttons{display:flex;flex-direction:column;gap:8px;width:100%}
.btn{
  border:none;border-radius:18px;padding:10px 6px;font-size:.85rem;font-weight:800;
  cursor:pointer;transition:transform .15s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  width:100%;line-height:1.2;
}
.btn:active{transform:translateY(3px) scale(.96)}
.btn-hint{background:#fff3c4;color:#b4690e;border:2px solid #ffe07d;box-shadow:0 4px 0 #ffd24c}
.btn-bgm{background:#eef6ff;color:#4b7bec;border:2px solid #cbe2ff;box-shadow:0 4px 0 #b3d4ff}
.btn-fullscreen{background:#f0f7f0;color:#2f9e44;border:2px solid #b7e4c7;box-shadow:0 4px 0 #94d3a8}
.btn-size{background:#f6f0ff;color:#7c4dff;border:2px solid #dccbff;box-shadow:0 4px 0 #cdb6ff}
body.fullscreen-mode .top-bar{width:88px;padding:10px 6px;border-radius:20px}
body.fullscreen-mode .stage-badge{font-size:.85rem;padding:6px 6px}
body.fullscreen-mode .star{width:28px;height:28px}
body.fullscreen-mode .btn{padding:8px 4px;font-size:.8rem;box-shadow:none}

/* 그림 영역: holder(남는 공간 전체) 안에 frame(배율 적용)을 가운데 배치 */
.arena-holder{
  flex:1;min-width:0;min-height:0;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.arena-frame{
  position:relative;
  width:calc(var(--s) * 100%);height:calc(var(--s) * 100%);
  border-radius:30px;
  transform:translate(var(--tx,0px),var(--ty,0px));
}
.arena-frame.dragging{outline:3px dashed rgba(255,92,147,.55);outline-offset:4px}
.game-arena{
  width:100%;height:100%;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:8px;
}
.board-wrapper{
  min-width:0;min-height:0;padding:8px;border-radius:26px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 12px 28px rgba(130,115,160,.1);
}
.left-theme{background:#fff0f6;border:4px solid #ffc2dc;align-items:flex-end}
.right-theme{background:#f5f0ff;border:4px solid #d8c7ff;align-items:flex-start}
.board-label{flex:none;font-size:.95rem;font-weight:800;margin-bottom:6px;padding:3px 14px;border-radius:999px;background:#fff;line-height:1.3}
.left-theme .board-label{color:#ff6699}
.right-theme .board-label{color:#8c68cd}
body.fullscreen-mode .board-wrapper{padding:6px;border-radius:20px}
body.fullscreen-mode .board-label{font-size:.85rem;margin-bottom:4px;padding:2px 10px}

/* 모서리 크기 조절 핸들 */
.resize-handle{
  position:absolute;width:34px;height:34px;border-radius:50%;
  background:#fff;border:3px solid #ff85b3;color:#ff5c93;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;font-weight:900;line-height:1;
  box-shadow:0 3px 10px rgba(255,92,147,.35);
  opacity:.7;z-index:40;touch-action:none;cursor:nwse-resize;
  transition:opacity .15s,transform .15s;
}
.resize-handle:hover,.resize-handle.active{opacity:1}
.resize-handle.active{transform:scale(1.2)}
.resize-handle[data-corner="tl"]{top:-10px;left:-10px}
.resize-handle[data-corner="tr"]{top:-10px;right:-10px;cursor:nesw-resize}
.resize-handle[data-corner="bl"]{bottom:-10px;left:-10px;cursor:nesw-resize}
.resize-handle[data-corner="br"]{bottom:-10px;right:-10px}
.move-handle{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  height:30px;padding:0 16px;border-radius:999px;
  background:#fff;border:3px solid #8c68cd;color:#7c4dff;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  font-size:.85rem;font-weight:900;line-height:1;
  box-shadow:0 3px 10px rgba(140,104,205,.35);
  opacity:.8;z-index:40;touch-action:none;cursor:grab;
}
.move-handle.active{opacity:1;cursor:grabbing}
.arena-frame.full .move-handle{display:none}
.size-badge{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:45;
  background:rgba(255,92,147,.92);color:#fff;font-weight:900;font-size:1.6rem;
  padding:8px 22px;border-radius:999px;pointer-events:none;
  opacity:0;transition:opacity .25s;
}
.size-badge.show{opacity:1}

/* 캔버스: 크기는 JS가 정확히 맞춤 */
.canvas-stage{position:relative;flex:none;border-radius:18px;overflow:hidden;background:#fff;border:4px solid #fff;cursor:pointer;line-height:0;touch-action:manipulation}
.canvas-stage canvas{display:block}
.overlay-layer{position:absolute;inset:0;pointer-events:none}
.found-ring{position:absolute;border:6px solid #ff5c93;border-radius:50%;box-shadow:0 0 14px rgba(255,92,147,.7),inset 0 0 10px rgba(255,255,255,.6);animation:ringPop .5s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes ringPop{0%{transform:scale(1.7);opacity:0}100%{transform:scale(1);opacity:1}}
.hint-ring{position:absolute;border:5px dashed #ffb703;border-radius:50%;background:rgba(255,224,102,.3);animation:hintPulse .65s ease-in-out infinite alternate}
@keyframes hintPulse{from{transform:scale(.88);opacity:.55}to{transform:scale(1.08);opacity:1}}
.hint-cell{position:absolute;border:5px dashed #ffb703;border-radius:14px;background:rgba(255,224,102,.32);animation:cellPulse .7s ease-in-out infinite alternate}
@keyframes cellPulse{from{opacity:.5}to{opacity:1}}
.missed-ring{position:absolute;border:6px solid #3b82f6;border-radius:50%;box-shadow:0 0 14px rgba(59,130,246,.75),inset 0 0 10px rgba(255,255,255,.6);animation:ringPop .5s cubic-bezier(.34,1.56,.64,1) forwards}
.wrong-mark{position:absolute;transform:translate(-50%,-50%);font-size:2.2rem;line-height:1;animation:fadeOutUp .6s ease forwards;pointer-events:none}
@keyframes fadeOutUp{0%{opacity:1;transform:translate(-50%,-50%) scale(.7)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.canvas-stage.shake{animation:shakeBoard .35s ease}
@keyframes shakeBoard{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}

/* 오른쪽 세로 타이머 바 */
.bottom-timer-bar{
  position:relative;width:76px;padding:14px 8px;border-radius:28px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
}
body.fullscreen-mode .bottom-timer-bar{width:64px;padding:10px 6px;border-radius:20px}
.timer-icon{font-size:1.5rem}
.progress-track{
  flex:1;width:26px;background:#f3effa;border-radius:999px;overflow:hidden;
  padding:4px;border:2px solid #e6def5;
  display:flex;flex-direction:column;justify-content:flex-end;
}
body.fullscreen-mode .progress-track{width:22px}
.progress-fill{
  width:100%;height:var(--pct,100%);
  background:linear-gradient(0deg,#7ae582,#4cc9f0);
  border-radius:999px;transition:height .1s linear,width .1s linear;
}
.progress-fill.warning{background:linear-gradient(0deg,#ffd166,#ff9f1c)}
.progress-fill.danger{background:linear-gradient(0deg,#ff8fa3,#ff4d6d);animation:barPulse .5s infinite alternate}
@keyframes barPulse{from{opacity:.75}to{opacity:1}}
.timer-text{font-size:1.1rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;transition:color .3s;white-space:nowrap}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(255,240,248,.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.overlay.hidden{display:none}
.modal-card{background:linear-gradient(180deg,#fff 0%,#fff7fb 100%);padding:32px 36px;border-radius:36px;border:4px solid #ffd6e7;text-align:center;max-width:460px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 45px rgba(255,133,179,.25);animation:modalBounce .55s cubic-bezier(.34,1.56,.64,1)}
@keyframes modalBounce{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-emoji{font-size:4.2rem;margin-bottom:8px;display:block}
.modal-title{font-size:1.75rem;font-weight:800;color:#ff5c93;margin:0 0 10px}
.modal-desc{font-size:1.05rem;color:var(--sub);margin:0 0 20px;line-height:1.55}
.btn-start{background:linear-gradient(135deg,#ff85b3,#ff5c93);color:#fff;font-size:1.3rem;font-weight:800;padding:15px 40px;border:none;border-radius:999px;cursor:pointer;box-shadow:0 8px 0 #e04379,0 14px 24px rgba(255,92,147,.35);transition:transform .15s;margin-top:6px}
.btn-start:active{transform:translateY(4px);box-shadow:0 4px 0 #e04379}
.btn-start:disabled{opacity:.6;cursor:wait}
.btn-review{display:block;margin:16px auto 0;background:#eef6ff;color:#4b7bec;border:2px solid #cbe2ff;border-radius:999px;padding:10px 22px;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #b3d4ff}
.btn-review:active{transform:translateY(3px)}
.btn-review.hidden,.review-continue.hidden{display:none}
.review-continue{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;background:linear-gradient(135deg,#ff85b3,#ff5c93);color:#fff;font-size:1.2rem;font-weight:800;padding:12px 32px;border:none;border-radius:999px;cursor:pointer;box-shadow:0 6px 0 #e04379,0 10px 20px rgba(255,92,147,.35)}
.review-continue:active{transform:translateX(-50%) translateY(3px)}

/* 오답 패널티 / 막판 긴장감 */
.timer-text.urgent{color:#ff3355;animation:timerBeat .5s infinite alternate}
@keyframes timerBeat{from{transform:scale(1)}to{transform:scale(1.25)}}
body.urgent::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;box-shadow:inset 0 0 90px 24px rgba(255,40,80,.5);animation:vignette 1s ease-in-out infinite alternate}
body.urgent5::after{box-shadow:inset 0 0 130px 44px rgba(255,20,60,.7);animation-duration:.35s}
@keyframes vignette{from{opacity:.25}to{opacity:1}}
body.urgent .progress-track{animation:trackShake .4s infinite}
body.urgent5 .progress-track{animation-duration:.18s}
@keyframes trackShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.penalty-pop{position:absolute;right:84px;bottom:14px;background:#fff;color:#ff3355;border:3px solid #ff3355;font-size:1.4rem;font-weight:900;padding:2px 14px;border-radius:999px;pointer-events:none;z-index:60;white-space:nowrap;animation:penaltyUp .9s ease forwards}
@keyframes penaltyUp{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-22px) scale(1)}}

/* 설정(개수/시간) */
.setting-group{display:flex;flex-direction:column;gap:10px;margin:0 0 20px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;font-weight:800;color:var(--sub);font-size:1.05rem;padding:0 12px}
.stepper{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #ffd6e7;border-radius:999px;padding:4px 8px}
.stepper button{width:38px;height:38px;border-radius:50%;border:none;background:#ffe3ee;color:#ff5c93;font-size:1.4rem;font-weight:900;cursor:pointer}
.stepper button:active{transform:scale(.9)}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper b{min-width:58px;font-size:1.35rem;color:#ff5c93;text-align:center}

/* 세로 화면(모바일): 상하 바 + 위아래 그림 배치 */
@media (max-aspect-ratio:1/1){
  body{flex-direction:column;align-items:center}
  .top-bar{width:100%;flex-direction:row;flex-wrap:wrap;justify-content:center;padding:8px 12px;border-radius:24px}
  .stage-badge{width:auto;font-size:.95rem;padding:5px 12px}
  .stars-container{width:auto;flex:none;flex-direction:row;padding:5px 12px}
  .star{width:28px;height:28px}
  .action-buttons{width:auto;flex-direction:row}
  .btn{width:auto;flex-direction:row;padding:7px 12px;font-size:.85rem}
  .arena-holder{width:100%}
  .game-arena{grid-template-columns:1fr;grid-template-rows:repeat(2,minmax(0,1fr))}
  .left-theme,.right-theme{align-items:center}
  .bottom-timer-bar{width:100%;flex-direction:row;padding:8px 16px;border-radius:24px}
  .progress-track{width:auto;height:22px;flex-direction:row;justify-content:flex-start}
  .progress-fill{width:var(--pct,100%);height:100%;background:linear-gradient(90deg,#7ae582,#4cc9f0)}
  .progress-fill.warning{background:linear-gradient(90deg,#ffd166,#ff9f1c)}
  .progress-fill.danger{background:linear-gradient(90deg,#ff8fa3,#ff4d6d)}
  .timer-text{min-width:56px;text-align:right}
  .penalty-pop{right:16px;bottom:auto;top:-44px}
}
</style>
</head>
<body>

<audio id="bgmAudio" loop preload="auto"></audio>

<header class="top-bar">
  <div class="stage-badge" id="stageBadge">🔍 준비</div>
  <div class="stars-container" id="starsContainer"></div>
  <div class="action-buttons">
    <button class="btn btn-hint" onclick="useHint()"><span>💡</span><span>힌트</span></button>
    <button class="btn btn-size" id="sizeResetBtn" onclick="resetArenaScale()"><span>📐</span><span id="sizeResetText">크기 100%</span></button>
    <button class="btn btn-bgm" id="bgmToggleBtn" onclick="toggleBgm()"><span>🔊</span><span>음악 켬</span></button>
    <button class="btn btn-fullscreen" id="fullscreenBtn" onclick="toggleFullscreen()"><span>⛶</span><span>전체화면</span></button>
  </div>
</header>

<div class="arena-holder" id="arenaHolder">
  <div class="arena-frame" id="arenaFrame">
    <main class="game-arena" id="arena">
      <section class="board-wrapper left-theme">
        <div class="board-label">원본 그림</div>
        <div class="canvas-stage" id="leftStage">
          <canvas id="leftCanvas"></canvas>
          <div class="overlay-layer" id="leftOverlay"></div>
        </div>
      </section>
      <section class="board-wrapper right-theme">
        <div class="board-label">다른 그림</div>
        <div class="canvas-stage" id="rightStage">
          <canvas id="rightCanvas"></canvas>
          <div class="overlay-layer" id="rightOverlay"></div>
        </div>
      </section>
    </main>
    <div class="resize-handle" data-corner="tl" title="드래그해서 크기 조절 (두 번 탭하면 100%)">⤡</div>
    <div class="resize-handle" data-corner="tr" title="드래그해서 크기 조절 (두 번 탭하면 100%)">⤢</div>
    <div class="resize-handle" data-corner="bl" title="드래그해서 크기 조절 (두 번 탭하면 100%)">⤢</div>
    <div class="resize-handle" data-corner="br" title="드래그해서 크기 조절 (두 번 탭하면 100%)">⤡</div>
    <div class="move-handle" id="moveHandle" title="드래그해서 위치 이동">✥ 이동</div>
    <div class="size-badge" id="sizeBadge">100%</div>
  </div>
</div>

<footer class="bottom-timer-bar">
  <span class="timer-icon">⏰</span>
  <div class="progress-track"><div class="progress-fill" id="timerFill"></div></div>
  <div class="timer-text" id="timerText">90초</div>
</footer>

<button class="review-continue hidden" id="reviewContinue" onclick="closeReview()">▶ 계속하기</button>

<div class="overlay" id="modalOverlay">
  <div class="modal-card">
    <span class="modal-emoji" id="modalEmoji">🧚‍♀️</span>
    <h2 class="modal-title" id="modalTitle">다른 그림 찾기</h2>
    <p class="modal-desc" id="modalDesc">두 그림을 비교해서 다른 곳을 모두 터치해 보세요!<br>어느 쪽 그림을 눌러도 찾을 수 있어요.<br>⚠️ 틀리게 누르면 시간이 5초 줄어요!</p>
    <div class="setting-group">
      <div class="setting-row">
        <span>🔍 찾을 개수</span>
        <div class="stepper">
          <button id="diffMinus" onclick="changeDiffCount(-1)">−</button>
          <b id="diffCountText">3</b>
          <button id="diffPlus" onclick="changeDiffCount(1)">＋</button>
        </div>
      </div>
      <div class="setting-row">
        <span>⏰ 제한 시간</span>
        <div class="stepper">
          <button id="timeMinus" onclick="changeTime(-30)">−</button>
          <b id="timeText">90초</b>
          <button id="timePlus" onclick="changeTime(30)">＋</button>
        </div>
      </div>
    </div>
    <button class="btn-start" id="modalStartBtn" onclick="startGame()">게임 시작!</button>
    <button class="btn-review hidden" id="reviewBtn" onclick="reviewAnswers()">👀 정답 다시 보기</button>
  </div>
</div>

<script>
/* ---------- 문제 데이터 ----------
   P(폴더, 왼쪽파일, 오른쪽파일, [[x,y,너비,높이], ...], 배경음)
   이미지는 GitHub 원본 주소로 적어 두고, 불러올 때 jsDelivr CDN을 먼저 시도합니다. */
const IMG_BASE = "https://github.com/morningM00N/kids/blob/main/img/";
function P(dir, l, r, rects, bgm) {
  return {
    L: IMG_BASE + dir + l + "?raw=true",
    R: IMG_BASE + dir + r + "?raw=true",
    A: rects.map(([x, y, width, height]) => ({ x, y, width, height })),
    B: bgm
  };
}

const PRSET = [
  P("261120/", "m5-1.jpg", "m5-2.jpg", [
    [6,48,468,385],[988,6,509,267],[1255,589,243,273],[469,1106,128,131],[53,450,355,740],
    [1062,885,353,362],[947,1337,243,253],[422,1392,259,230],[994,1622,501,485]], "wav/1.mp3"),
  P("261120/", "ge1-1.png", "ge1-2.png", [
    [70,197,363,305],[360,584,111,129],[869,12,566,629],[972,1033,245,163],[147,1732,310,472],[1339,1515,348,506]], "wav/1.mp3"),
  P("261120/", "gez1-1.png", "gez1-2.png", [
    [89,0,511,420],[474,542,314,276],[977,1245,171,156],[507,1152,215,198],[726,940,264,222],
    [1115,1559,198,218],[149,1296,191,173]], "wav/1.mp3"),
  P("261120/", "je1-1.png", "je1-2.png", [
    [1401,1560,129,114],[1418,1747,155,128],[755,1254,189,235],[596,958,327,165],[1377,94,258,251],
    [1460,348,351,694],[4,171,395,530]], "wav/1.mp3"),
  P("261120/", "n1-1.png", "n1-2.png", [

/* ---------- 효과음 (첫 사용자 제스처 때 생성) ---------- */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freqs, step, dur, vol, type = 'sine') {
  const ctx = getAudioCtx(), now = ctx.currentTime;
  freqs.forEach((f, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain(), t = now + i * step;
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.01, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur);
  });
}
let tickToggle = false;
function playTick(urgent) {
  tickToggle = !tickToggle;
  const f = tickToggle ? (urgent ? 2200 : 1800) : (urgent ? 1500 : 1200);
  tone([f], 0, 0.06, urgent ? 0.2 : 0.11, 'triangle');
}
function playSoundEffect(type) {
  if (type === 'correct') tone([523.25, 659.25, 783.99], 0.1, 0.25, 0.22);
  else if (type === 'wrong') tone([220, 170], 0.09, 0.15, 0.16);
  else if (type === 'clear') tone([523.25, 659.25, 783.99, 1046.5], 0.12, 0.45, 0.22);
}

/* ---------- 이미지 로딩 (CDN 우선, 실패 시 원래 주소) + 다음 문제 미리 불러오기 ---------- */
function toCdn(url) {
  // https://github.com/{user}/{repo}/blob/{branch}/{path}?raw=true -> jsDelivr
  const m = url.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+?)(\?raw=true)?$/);
  return m ? `https://cdn.jsdelivr.net/gh/${m[1]}/${m[2]}@${m[3]}/${m[4]}` : url;
}
function loadOne(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('load fail'));
    img.src = src;
  });
}
const imageCache = new Map(); // 원래 주소 -> Promise<Image>
function loadImage(src) {
  if (!imageCache.has(src)) {
    const p = loadOne(toCdn(src))
      .catch(() => loadOne(src))
      .catch(() => { imageCache.delete(src); throw new Error('이미지를 불러올 수 없어요. 인터넷 연결을 확인해 주세요.'); });
    imageCache.set(src, p);
  }
  return imageCache.get(src);
}
function pruneImageCache(keepSrcs) {
  [...imageCache.keys()].forEach(k => { if (!keepSrcs.includes(k)) imageCache.delete(k); });
}

/* ---------- 셔플 큐(Bag): 현재 '찾을 개수' 이상의 차이가 있는 문제만 ---------- */
function eligibleIndexes() {
  const list = [];
  PRSET.forEach((p, i) => { if (p.A.length >= diffCount) list.push(i); });
  return list;
}
function refillBag() {
  problemBag = eligibleIndexes();
  for (let i = problemBag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [problemBag[i], problemBag[j]] = [problemBag[j], problemBag[i]];
  }
  if (problemBag.length > 1 && problemBag[problemBag.length - 1] === currentSetIndex) {
    [problemBag[0], problemBag[problemBag.length - 1]] = [problemBag[problemBag.length - 1], problemBag[0]];
  }
}
function peekNextProblemIndex() {
  if (problemBag.length === 0) refillBag();
  return problemBag[problemBag.length - 1];
}
function pickNextProblemIndex() {
  peekNextProblemIndex();
  return problemBag.pop();
}
function preloadNext() {
  const idx = peekNextProblemIndex();
  const cur = PRSET[currentSetIndex];
  const nxt = PRSET[idx];
  if (!nxt) return;
  pruneImageCache([cur && cur.L, cur && cur.R, nxt.L, nxt.R]);
  loadImage(nxt.L).catch(() => {});
  loadImage(nxt.R).catch(() => {});
}
function pickRandomDiffs(pool, count) {
  const arr = pool.map((item, id) => ({ ...item, id }));
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr.slice(0, Math.min(count, arr.length));
}
function renderStars(count) {
  $('starsContainer').innerHTML =
    Array.from({ length: count }, () => `<svg class="star" viewBox="0 0 24 24"><path d="${STAR_PATH}"/></svg>`).join('');
}

/* ---------- 설정(개수 / 시간) ---------- */
function updateSettingsUI() {
  $('diffCountText').textContent = diffCount;
  $('diffMinus').disabled = diffCount <= DIFF_MIN;
  $('diffPlus').disabled = diffCount >= DIFF_MAX;

  $('timeText').textContent = `${gameDurationSec}초`;
  $('timeMinus').disabled = gameDurationSec <= TIME_MIN;
  $('timePlus').disabled = gameDurationSec >= TIME_MAX;

  if (!isPlaying) {
    renderStars(diffCount);
    $('timerText').textContent = `${gameDurationSec}초`;
  }
}
function changeDiffCount(d) {
  diffCount = Math.max(DIFF_MIN, Math.min(DIFF_MAX, diffCount + d));
  try { localStorage.setItem('diffCount', diffCount); } catch (e) {}
  problemBag = []; // 개수가 바뀌면 후보 문제도 달라지므로 큐를 새로 만듦
  updateSettingsUI();
}
function changeTime(delta) {
  gameDurationSec = Math.max(TIME_MIN, Math.min(TIME_MAX, gameDurationSec + delta));
  try { localStorage.setItem('gameDurationSec', gameDurationSec); } catch (e) {}
  updateSettingsUI();
}
updateSettingsUI();

/* ---------- 그림 영역 크기 조절 (모서리 드래그) ---------- */
const arenaHolder = $('arenaHolder'), arenaFrame = $('arenaFrame'), sizeBadge = $('sizeBadge');
let badgeTimer = null;

function applyArenaScale(showBadge) {
  // 영역이 화면 밖으로 나가지 않도록 이동량을 제한
  const lim = (1 - arenaScale) / 2;
  arenaFx = Math.max(-lim, Math.min(lim, arenaFx));
  arenaFy = Math.max(-lim, Math.min(lim, arenaFy));
  const rootStyle = document.documentElement.style;
  rootStyle.setProperty('--s', arenaScale.toFixed(3));
  rootStyle.setProperty('--tx', (arenaFx * arenaHolder.clientWidth).toFixed(1) + 'px');
  rootStyle.setProperty('--ty', (arenaFy * arenaHolder.clientHeight).toFixed(1) + 'px');
  arenaFrame.classList.toggle('full', arenaScale >= 0.99);
  const pct = Math.round(arenaScale * 100);
  $('sizeResetText').textContent = `크기 ${pct}%`;
  if (showBadge) {
    sizeBadge.textContent = `${pct}%`;
    sizeBadge.classList.add('show');
    clearTimeout(badgeTimer);
    badgeTimer = setTimeout(() => sizeBadge.classList.remove('show'), 700);
  }
  fitCanvasesToScreen();
}
function saveArenaScale() {
  try {
    localStorage.setItem('arenaScale', arenaScale.toFixed(3));
    localStorage.setItem('arenaFx', arenaFx.toFixed(4));
    localStorage.setItem('arenaFy', arenaFy.toFixed(4));
  } catch (e) {}
}
function resetArenaScale() {
  arenaScale = SCALE_MAX;
  arenaFx = 0; arenaFy = 0;
  saveArenaScale();
  applyArenaScale(true);
}

(function setupResizeHandles() {
  const handles = arenaFrame.querySelectorAll('.resize-handle');
  const SIGN = { tl: [-1, -1], tr: [1, -1], bl: [-1, 1], br: [1, 1] };
  let drag = null;
  let lastTap = 0;

  handles.forEach(h => {
    h.addEventListener('pointerdown', e => {
      e.preventDefault();
      e.stopPropagation();

      // 두 번 빠르게 탭하면 100%로 되돌리기
      const now = Date.now();
      if (now - lastTap < 350) { lastTap = 0; resetArenaScale(); return; }
      lastTap = now;

      const hr = arenaHolder.getBoundingClientRect();
      const bx = hr.left + hr.width / 2, by = hr.top + hr.height / 2;
      const cx = bx + arenaFx * hr.width, cy = by + arenaFy * hr.height;
      const [sx, sy] = SIGN[h.dataset.corner];
      // 지금 모서리 위치와 손가락 위치의 차이를 기억해 두면 잡는 순간 크기가 튀지 않음
      const cornerX = cx + sx * (hr.width / 2) * arenaScale;
      const cornerY = cy + sy * (hr.height / 2) * arenaScale;
      drag = {
        id: e.pointerId, h, bx, by, W: hr.width, H: hr.height, hw: hr.width / 2, hh: hr.height / 2, sx, sy,
        offX: e.clientX - cornerX, offY: e.clientY - cornerY
      };
      h.setPointerCapture(e.pointerId);
      h.classList.add('active');
      arenaFrame.classList.add('dragging');
    });

    h.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      // 가운데 기준으로 대칭이라, 중심에서 모서리까지의 비율이 곧 배율
      const curCx = drag.bx + arenaFx * drag.W, curCy = drag.by + arenaFy * drag.H;
      const rx = ((e.clientX - drag.offX - curCx) * drag.sx) / drag.hw;
      const ry = ((e.clientY - drag.offY - curCy) * drag.sy) / drag.hh;
      arenaScale = Math.max(SCALE_MIN, Math.min(SCALE_MAX, Math.max(rx, ry)));
      applyArenaScale(true);
    });

    const end = e => {
      if (!drag || e.pointerId !== drag.id) return;
      drag.h.classList.remove('active');
      arenaFrame.classList.remove('dragging');
      drag = null;
      saveArenaScale();
    };
    h.addEventListener('pointerup', end);
    h.addEventListener('pointercancel', end);
  });
})();

(function setupMoveHandle() {
  const mh = $('moveHandle');
  let mv = null;
  mh.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    mv = { id: e.pointerId, x: e.clientX, y: e.clientY, fx: arenaFx, fy: arenaFy,
           W: arenaHolder.clientWidth, H: arenaHolder.clientHeight };
    mh.setPointerCapture(e.pointerId);
    mh.classList.add('active');
    arenaFrame.classList.add('dragging');
  });
  mh.addEventListener('pointermove', e => {
    if (!mv || e.pointerId !== mv.id) return;
    arenaFx = mv.fx + (e.clientX - mv.x) / mv.W;
    arenaFy = mv.fy + (e.clientY - mv.y) / mv.H;
    applyArenaScale(false); // 범위 제한은 여기서 처리
  });
  const end = e => {
    if (!mv || e.pointerId !== mv.id) return;
    mv = null;
    mh.classList.remove('active');
    arenaFrame.classList.remove('dragging');
    saveArenaScale();
  };
  mh.addEventListener('pointerup', end);
  mh.addEventListener('pointercancel', end);
})();
applyArenaScale(false);

/* ---------- 게임 시작 ---------- */
async function startGame() {
  if (isLoading) return;
  getAudioCtx();
  const btn = $('modalStartBtn');
  const label = btn.textContent;
  isLoading = true; btn.disabled = true; btn.textContent = '불러오는 중... ⏳';

  const prevIndex = currentSetIndex;
  currentSetIndex = pickNextProblemIndex();
  const problem = PRSET[currentSetIndex];
  try {
    [imgL, imgR] = await Promise.all([loadImage(problem.L), loadImage(problem.R)]);
  } catch (err) {
    problemBag.push(currentSetIndex); // 실패 시 큐에 복구
    currentSetIndex = prevIndex;
    alert(err.message);
    isLoading = false; btn.disabled = false; btn.textContent = label;
    return;
  }
  isLoading = false; btn.disabled = false; btn.textContent = label;

  $('modalOverlay').classList.add('hidden');
  $('leftOverlay').innerHTML = '';
  $('rightOverlay').innerHTML = '';
  leftStage.classList.remove('shake');
  rightStage.classList.remove('shake');

  activeDiffs = pickRandomDiffs(problem.A, diffCount);
  foundIds = [];
  hintTargetId = null; hintStage = 0;
  isPlaying = true;

  $('stageBadge').textContent = `🔍 ${currentSetIndex + 1}번`;
  renderStars(activeDiffs.length);

  bgmAudio.pause();
  if (problem.B) {
    bgmAudio.src = problem.B;
    bgmAudio.currentTime = 0;
    if (!isBgmMuted) bgmAudio.play().catch(() => {});
  }

  renderCanvases();
  startTimer();
  preloadNext(); // 플레이하는 동안 다음 문제 그림을 미리 받아 둠
}

function renderCanvases() {
  const W = imgL.naturalWidth, H = imgL.naturalHeight;
  leftCanvas.width = rightCanvas.width = W;
  leftCanvas.height = rightCanvas.height = H;

  leftCanvas.getContext('2d').drawImage(imgL, 0, 0, W, H);

  const rctx = rightCanvas.getContext('2d');
  rctx.drawImage(imgL, 0, 0, W, H);
  activeDiffs.forEach(r => {
    rctx.drawImage(imgR, r.x, r.y, r.width, r.height, r.x, r.y, r.width, r.height);
  });

  fitCanvasesToScreen();
}

/* ---------- 화면(= 조절된 영역)에 꽉 차게 크기 맞추기 ---------- */
function fitCanvasesToScreen() {
  if (!imgL) return;
  const wrap = leftStage.parentElement;
  const cs = getComputedStyle(wrap);
  const label = wrap.querySelector('.board-label');
  const labelH = label.offsetHeight + parseFloat(getComputedStyle(label).marginBottom);

  const stageBorder = 8;
  const availW = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - stageBorder;
  const availH = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - labelH - stageBorder;
  if (availW <= 0 || availH <= 0) return;

  const W = imgL.naturalWidth, H = imgL.naturalHeight;
  const scale = Math.min(availW / W, availH / H);
  const w = Math.max(1, Math.floor(W * scale)), h = Math.max(1, Math.floor(H * scale));

  [leftCanvas, rightCanvas].forEach(c => {
    c.style.width = w + 'px';
    c.style.height = h + 'px';
  });
}
new ResizeObserver(() => fitCanvasesToScreen()).observe(arenaFrame);
new ResizeObserver(() => applyArenaScale(false)).observe(arenaHolder); // 창 크기가 바뀌어도 위치 유지

/* ---------- 터치/클릭 처리 (pointerdown: 터치 지연 없음) ---------- */
leftStage.addEventListener('pointerdown', e => handleStageClick(e, leftStage, leftCanvas));
rightStage.addEventListener('pointerdown', e => handleStageClick(e, rightStage, rightCanvas));

function handleStageClick(event, stageEl, canvasEl) {
  if (!isPlaying || !imgL) return;
  if (event.pointerType === 'mouse' && event.button !== 0) return;

  const rect = canvasEl.getBoundingClientRect();
  const cx = event.clientX - rect.left, cy = event.clientY - rect.top;
  if (cx < 0 || cy < 0 || cx > rect.width || cy > rect.height) return;

  const clickX = cx * (imgL.naturalWidth / rect.width);
  const clickY = cy * (imgL.naturalHeight / rect.height);

  // 여러 영역이 겹쳐도 가장 가까운 중심점의 차이를 고름
  let matched = null, best = Infinity;
  activeDiffs.forEach(it => {
    if (foundIds.includes(it.id)) return;
    const inside =
      clickX >= it.x - TOUCH_PADDING_PX && clickX <= it.x + it.width + TOUCH_PADDING_PX &&
      clickY >= it.y - TOUCH_PADDING_PX && clickY <= it.y + it.height + TOUCH_PADDING_PX;
    if (!inside) return;
    const d = Math.hypot(clickX - (it.x + it.width / 2), clickY - (it.y + it.height / 2));
    if (d < best) { best = d; matched = it; }
  });

  if (matched) {
    foundIds.push(matched.id);
    playSoundEffect('correct');
    if (matched.id === hintTargetId) { clearHints(); hintTargetId = null; hintStage = 0; }
    addMarkerRing('leftOverlay', matched, 'found-ring');
    addMarkerRing('rightOverlay', matched, 'found-ring');
    const stars = $('starsContainer').querySelectorAll('.star');
    if (stars[foundIds.length - 1]) stars[foundIds.length - 1].classList.add('earned');
    if (foundIds.length === activeDiffs.length) endGame(true);
  } else {
    playSoundEffect('wrong');
    applyPenalty();
    if (!isPlaying) return; // 패널티로 시간이 끝났다면 표시 생략
    stageEl.classList.remove('shake');
    void stageEl.offsetWidth;
    stageEl.classList.add('shake');

    const mark = document.createElement('div');
    mark.className = 'wrong-mark';
    mark.textContent = '❌';
    mark.style.left = `${cx}px`;
    mark.style.top = `${cy}px`;
    stageEl.querySelector('.overlay-layer').appendChild(mark);
    setTimeout(() => mark.remove(), 600);
  }
}

function addMarkerRing(overlayId, item, className) {
  const W = imgL.naturalWidth, H = imgL.naturalHeight;
  const minSize = Math.min(W, H) * 0.08;
  const boxW = Math.max(item.width, minSize), boxH = Math.max(item.height, minSize);
  const cX = item.x + item.width / 2, cY = item.y + item.height / 2;

  const ring = document.createElement('div');
  ring.className = className;
  ring.dataset.id = item.id;
  ring.style.left = `${((cX - boxW / 2) / W) * 100}%`;
  ring.style.top = `${((cY - boxH / 2) / H) * 100}%`;
  ring.style.width = `${(boxW / W) * 100}%`;
  ring.style.height = `${(boxH / H) * 100}%`;
  $(overlayId).appendChild(ring);
}

/* ---------- 힌트: 1번째 = 8등분(4x2) 중 어느 칸인지, 2번째 = 정답 동그라미 ---------- */
const HINT_COLS = 4, HINT_ROWS = 2;
let hintTargetId = null, hintStage = 0;

function clearHints() {
  document.querySelectorAll('.hint-ring, .hint-cell').forEach(el => el.remove());
}
function addHintCell(overlayId, item) {
  const W = imgL.naturalWidth, H = imgL.naturalHeight;
  const cX = item.x + item.width / 2, cY = item.y + item.height / 2;
  const col = Math.min(HINT_COLS - 1, Math.max(0, Math.floor(cX / (W / HINT_COLS))));
  const row = Math.min(HINT_ROWS - 1, Math.max(0, Math.floor(cY / (H / HINT_ROWS))));
  const cell = document.createElement('div');
  cell.className = 'hint-cell';
  cell.style.left = `${(col / HINT_COLS) * 100}%`;
  cell.style.top = `${(row / HINT_ROWS) * 100}%`;
  cell.style.width = `${100 / HINT_COLS}%`;
  cell.style.height = `${100 / HINT_ROWS}%`;
  $(overlayId).appendChild(cell);
}
function useHint() {
  if (!isPlaying) return;
  const remaining = activeDiffs.filter(d => !foundIds.includes(d.id));
  if (!remaining.length) return;
  const target = remaining[0];

  if (hintTargetId !== target.id) { hintTargetId = target.id; hintStage = 0; clearHints(); }

  if (hintStage === 0) {            // 1단계: 칸만 표시
    addHintCell('leftOverlay', target);
    addHintCell('rightOverlay', target);
    hintStage = 1;
  } else if (hintStage === 1) {     // 2단계: 정답 동그라미
    clearHints();
    addMarkerRing('leftOverlay', target, 'hint-ring');
    addMarkerRing('rightOverlay', target, 'hint-ring');
    hintStage = 2;
  }
}

/* ---------- 타이머 / 종료 ---------- */
let timerStart = 0, penaltyMs = 0, lastHalf = 0;

function setUrgent(level) {
  document.body.classList.toggle('urgent', level >= 1);
  document.body.classList.toggle('urgent5', level >= 2);
  $('timerText').classList.toggle('urgent', level >= 1);
}

function startTimer() {
  clearInterval(timerInterval);
  timerStart = Date.now();
  penaltyMs = 0;
  lastHalf = gameDurationSec * 2;
  tickToggle = false;
  setUrgent(0);
  $('timerFill').style.setProperty('--pct', '100%');
  $('timerFill').className = 'progress-fill';
  $('timerText').textContent = `${gameDurationSec}초`;
  timerInterval = setInterval(updateTimer, 100);
}

function updateTimer() {
  if (!isPlaying) return;
  const total = gameDurationSec * 1000;
  const remain = Math.max(0, total - (Date.now() - timerStart) - penaltyMs);
  const pct = (remain / total) * 100;
  const fill = $('timerFill');

  fill.style.setProperty('--pct', `${pct}%`);
  fill.className = 'progress-fill' + (pct <= 25 ? ' danger' : pct <= 50 ? ' warning' : '');
  $('timerText').textContent = `${Math.ceil(remain / 1000)}초`;

  const level = remain <= 5000 ? 2 : remain <= 10000 ? 1 : 0;
  setUrgent(level);

  const half = Math.ceil(remain / 500);
  if (half !== lastHalf && remain > 0) {
    lastHalf = half;
    if (level === 2 || half % 2 === 0) playTick(level >= 1);
  }
  if (remain <= 0) endGame(false);
}

function applyPenalty() {
  if (!isPlaying) return;
  penaltyMs += WRONG_PENALTY_SEC * 1000;
  const pop = document.createElement('div');
  pop.className = 'penalty-pop';
  pop.textContent = `-${WRONG_PENALTY_SEC}초`;
  $('timerText').parentElement.appendChild(pop);
  setTimeout(() => pop.remove(), 900);
  updateTimer();
}

function endGame(isWin) {
  if (!isPlaying) return;
  isPlaying = false;
  clearInterval(timerInterval);
  setUrgent(0);

  clearHints();
  if (!isWin) {
    // 못 찾은 정답을 파란 동그라미로 모두 보여주기
    activeDiffs.filter(d => !foundIds.includes(d.id)).forEach(d => {
      addMarkerRing('leftOverlay', d, 'missed-ring');
      addMarkerRing('rightOverlay', d, 'missed-ring');
    });
  }

  const emoji = $('modalEmoji'), title = $('modalTitle'), desc = $('modalDesc'), btn = $('modalStartBtn');
  if (isWin) {
    playSoundEffect('clear');
    emoji.textContent = '🎉';
    title.textContent = '우와! 정말 잘했어요!';
    desc.textContent = `반짝이는 별 ${activeDiffs.length}개를 모두 모았어요! 다른 문제도 해볼까요?`;
    btn.textContent = '다음 문제 하기!';
  } else {
    emoji.textContent = '⏰';
    title.textContent = '시간이 다 되었어요!';
    desc.textContent = `아쉽지만 ${foundIds.length}개를 찾았어요. 파란 동그라미가 못 찾은 곳이에요. 다시 도전해 볼까요?`;
    btn.textContent = '다시 하기!';
  }
  $('reviewBtn').classList.toggle('hidden', isWin);
  if (isWin) {
    setTimeout(() => $('modalOverlay').classList.remove('hidden'), 700);
  } else {
    // 졌을 때는 자동으로 넘어가지 않고, 정답을 보여 준 채 '계속하기'를 눌러야 결과 창으로 이동
    $('reviewContinue').classList.remove('hidden');
  }
}

/* 모달을 잠시 닫고 정답 다시 보기 */
function reviewAnswers() {
  $('modalOverlay').classList.add('hidden');
  $('reviewContinue').classList.remove('hidden');
}
function closeReview() {
  $('reviewContinue').classList.add('hidden');
  $('modalOverlay').classList.remove('hidden');
}

/* ---------- 음악 / 전체화면 ---------- */
function toggleBgm() {
  isBgmMuted = !isBgmMuted;
  const btn = $('bgmToggleBtn');
  if (isBgmMuted) {
    bgmAudio.pause();
    btn.innerHTML = '<span>🔇</span><span>음악 끔</span>';
  } else {
    if (isPlaying && bgmAudio.src) bgmAudio.play().catch(() => {});
    btn.innerHTML = '<span>🔊</span><span>음악 켬</span>';
  }
}

const fsEl = document.documentElement;
const canFullscreen = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
if (!canFullscreen) $('fullscreenBtn').style.display = 'none';

function toggleFullscreen() {
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if (!isFs) (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
  else (document.exitFullscreen || document.webkitExitFullscreen).call(document);
}
function syncFullscreenState() {
  const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.body.classList.toggle('fullscreen-mode', isFs);
  $('fullscreenBtn').innerHTML = isFs ? '<span>⛶</span><span>전체끔</span>' : '<span>⛶</span><span>전체화면</span>';
  fitCanvasesToScreen();
}
document.addEventListener('fullscreenchange', syncFullscreenState);
document.addEventListener('webkitfullscreenchange', syncFullscreenState);
</script>
